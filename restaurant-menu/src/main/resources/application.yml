server:
  port: 8082

spring:
  application:
    name: restaurant-menu

  datasource:
    url: jdbc:postgresql://postgres:5432/foodbox
    username: foodbox
    password: foodbox
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://discovery:8761/eureka